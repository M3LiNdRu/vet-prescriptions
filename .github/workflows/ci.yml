name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/VetPrescription.slnx

      - name: Build
        run: dotnet build backend/VetPrescription.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test backend/VetPrescription.slnx
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Check coverage threshold
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/report" -reporttypes:TextSummary \
            "-assemblyfilters:-VetPrescription.IntegrationTests;-VetPrescription.UnitTests" \
            "-classfilters:-Microsoft.AspNetCore.OpenApi.*;-System.Runtime.CompilerServices.*"
          cat ./coverage/report/Summary.txt
          LINE_COVERAGE=$(grep "Line coverage" ./coverage/report/Summary.txt | grep -oP '\d+\.\d+')
          echo "Line coverage: $LINE_COVERAGE%"
          awk "BEGIN { if ($LINE_COVERAGE < 80) { print \"Coverage below 80%\"; exit 1 } }"

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Test with coverage
        run: npx vitest run --coverage --passWithNoTests
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
