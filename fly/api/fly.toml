app = "vet-prescription-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"


[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS = "http://+:8080"
  MongoDB__DatabaseName = "vet_prescription"
  PdfsPath = "/app/pdfs"
  BaseUrl = "https://vet-prescription-api.fly.dev"

# MongoDB connection string is set as a Fly secret:
#   fly secrets set ConnectionStrings__MongoDB="mongodb://vet-prescription-db.internal:27017" --app vet-prescription-api
# The app reads it via ConnectionStrings__MongoDB env var (set in secrets, not here)

[[mounts]]
  source = "pdfs_data"
  destination = "/app/pdfs"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0


[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
