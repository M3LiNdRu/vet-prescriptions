name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_API_TOKEN_API: ${{ secrets.FLY_API_TOKEN_API }}
      FLY_API_TOKEN_FRONTEND: ${{ secrets.FLY_API_TOKEN_FRONTEND }}
      FLY_API_TOKEN_MONGO: ${{ secrets.FLY_API_TOKEN_MONGO }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy MongoDB
        if: ${{ env.FLY_API_TOKEN_MONGO != '' }}
        run: flyctl deploy --config fly/mongo/fly.toml --app vet-prescription-db --remote-only --yes
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN_MONGO }}

      - name: Deploy API
        run: flyctl deploy --app vet-prescription-api --remote-only --yes
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API != '' && secrets.FLY_API_TOKEN_API || secrets.FLY_API_TOKEN }}

      - name: Deploy Frontend
        run: flyctl deploy --app vet-prescription-ui --remote-only --yes
        working-directory: frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND != '' && secrets.FLY_API_TOKEN_FRONTEND || secrets.FLY_API_TOKEN }}
