openapi: 3.1.0
info:
  title: VetPrescription API
  version: 0.0.0
  description: >
    Veterinary prescription generator REST API.
    Compliant with Article 105.5 of Regulation (EU) 2019/6 (Catalonia jurisdiction).
  contact:
    name: Vet Prescription
servers:
  - url: http://localhost:8080/api
    description: Local Docker Compose

paths: {}

components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
