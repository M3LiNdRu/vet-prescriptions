name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy MongoDB
        if: ${{ secrets.FLY_API_TOKEN_MONGO != '' }}
        run: flyctl deploy --config fly/mongo/fly.toml --app vet-prescription-db --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MONGO }}

      - name: Deploy API
        run: flyctl deploy --config backend/fly.toml --app vet-prescription-api --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy Frontend
        run: flyctl deploy --config frontend/fly.toml --app vet-prescription-ui --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
